<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tapis Vert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a felt card table — menu of games, then per table: scores rail, board, chat on the right. */
:root{
  color-scheme: dark;
  --felt:#123a33; --felt-deep:#0b2723; --felt-line:#1f5248;
  --paper:#f6f3e9; --ink:#1b2422; --muted:#9fbdb4; --text:#eef6f2;
  --sun:#ffb22e; --sun-ink:#3a2500; --danger:#ff6a5c; --good:#5fd38a;
  --display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%, var(--felt) 0%, var(--felt-deep) 75%) fixed, var(--felt-deep);color:var(--text);font-family:var(--body);font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px}
button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-size:15px;background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #b9770c;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9770c}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--felt-line)}
button.mini{padding:4px 8px;font-size:12px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select{font-family:var(--body);font-size:15px;background:var(--felt-deep);color:var(--text);border:2px solid var(--felt-line);border-radius:10px;padding:8px 10px;min-width:0}
.wrap{max-width:1520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1;color:var(--text);text-decoration:none}
.logo .chip{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;color:#fff;
  background:repeating-conic-gradient(var(--danger) 0 30deg, #fff 30deg 45deg);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.logo .chip span{width:28px;height:28px;border-radius:50%;background:var(--danger);display:grid;place-items:center;font-size:17px;border:2px dashed rgba(255,255,255,.7)}
.logo small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.status{font-weight:800;background:rgba(0,0,0,.25);border-radius:999px;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;color:var(--sun)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:16px;padding:14px;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 10px;letter-spacing:.3px}
.center{max-width:460px;margin:30px auto 0;width:100%}
.board{display:flex;flex-direction:column;gap:14px;min-width:0}
.players{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.pl{display:grid;grid-template-columns:14px 1fr auto;gap:8px;row-gap:6px;align-items:center;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.03)}
.pl.me{background:rgba(255,178,46,.12)}
.pl .dot{width:14px;height:14px;border-radius:50%}
.pl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pl .st{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:normal}
.pl .sc{font-variant-numeric:tabular-nums;font-family:var(--display);font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pl .sc small{font-family:var(--body);font-size:11px;font-weight:800;color:var(--sun)}
.pl .bar{grid-column:1/-1;height:9px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.pl .bar i,.mbar i{display:block;height:100%;border-radius:inherit;background:var(--bc);transition:width .7s ease}
.pl.off{opacity:.5}
.pl.danger{box-shadow:inset 0 0 0 2px var(--danger);animation:risk 1.6s ease-in-out infinite}
@keyframes risk{50%{background:rgba(255,106,92,.16)}}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.05em}
.tag.lead{background:var(--good);color:#06361b}.tag.risk{background:var(--danger);color:#3a0500}
.mbar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
.handbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-weight:600;text-align:center;margin:0}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;box-shadow:none}
.colors button[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.invite{display:flex;gap:8px}
.invite input{flex:1;font-weight:700}
.code{font-family:var(--display);font-size:26px;letter-spacing:.15em;color:var(--sun)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.overlay{position:fixed;inset:0;background:rgba(5,18,16,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--felt);border:2px solid var(--felt-line);border-radius:20px;padding:22px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-align:center}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--felt-line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30;display:flex;gap:8px;align-items:center;animation:toast .3s ease-out;max-width:calc(100% - 32px)}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}
.big{font-family:var(--display);font-size:22px}
/* menu */
.hero{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-block:10px 4px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);margin:0;text-wrap:balance}
.hero p{margin:0;color:var(--muted);font-weight:600;max-width:52ch}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gtile{--ga:var(--sun);display:flex;flex-direction:column;gap:12px;text-align:left;background:linear-gradient(160deg, color-mix(in srgb, var(--ga) 22%, transparent), rgba(0,0,0,.25) 55%);border:2px solid color-mix(in srgb, var(--ga) 45%, var(--felt-line));border-radius:20px;padding:16px;color:var(--text);box-shadow:0 4px 0 rgba(0,0,0,.3);min-width:0}
button.gtile{cursor:pointer;font-weight:400}
button.gtile:hover{transform:translateY(-3px);border-color:var(--ga)}
.gtile .art{height:96px;display:grid;place-items:center;border-radius:14px;background:rgba(0,0,0,.2)}
.gtile h3{font-family:var(--display);font-weight:400;font-size:23px;margin:0}
.gtile p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.gtile .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ga)}
.gtile.soon{opacity:.7;cursor:default}
.pill{border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.1);color:var(--text)}
.suits{display:flex;gap:6px;font-size:38px;line-height:1}
.suits span{width:52px;height:68px;border-radius:9px;background:#fbf8f0;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.suits .r{color:#d8283f}.suits .b{color:#1b2422}
.suits span:nth-child(1){transform:rotate(-8deg)}.suits span:nth-child(4){transform:rotate(8deg)}
/* chat */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.shell.nochat{grid-template-columns:minmax(0,1fr)}
.chat{position:sticky;top:14px;display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:380px}
.chatlog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.msg{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 10px;line-height:1.4;overflow-wrap:anywhere;border-left:3px solid var(--mc)}
.msg b{color:var(--mc);margin-right:4px}
.msg.mine{background:rgba(255,178,46,.13)}
.msg.sys{background:none;border:0;color:var(--muted);font-size:12px;text-align:center;padding:2px 4px}
.chatform{display:flex;gap:6px;margin-top:8px}.chatform input{flex:1}
.quick{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:4px 9px;font-size:14px;background:rgba(255,255,255,.08);color:var(--text);box-shadow:none;border-radius:999px}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr)}.chat{position:static;height:380px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bull" viewBox="0 0 24 24"><path fill="currentColor" d="M1.5 4.5c.6 3.2 2.6 5 5.2 5.4h10.6c2.6-.4 4.6-2.2 5.2-5.4.9 3.9-.9 7-4.3 8v3.2c0 3.3-2.5 6-6.2 6s-6.2-2.7-6.2-6v-3.2c-3.4-1-5.2-4.1-4.3-8zM9 13.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm6 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM9.6 18.4c0 .8 1.1 1.4 2.4 1.4s2.4-.6 2.4-1.4-1.1-1.2-2.4-1.2-2.4.4-2.4 1.2z"/></symbol>
</svg>
<div class="wrap">
  <header>
    <a class="logo" href="/" id="logo"><span class="chip"><span>♣</span></span><div id="brand">Tapis Vert<small>Jeux entre amis, sans compte</small></div></a>
    <div class="status" id="status">Connexion…</div>
  </header>
  <div class="shell nochat" id="shell">
    <main id="app" style="min-width:0"><div class="panel center"><p class="note">Connexion…</p></div></main>
    <aside class="panel chat" id="chat" hidden aria-label="Discussion">
      <h2>Discussion</h2>
      <div class="chatlog" id="chatlog" aria-live="polite"></div>
      <div class="quick" id="quick"></div>
      <form class="chatform" id="chatform"><input id="chatin" maxlength="300" placeholder="Écrire un message…" autocomplete="off" aria-label="Message"><button type="submit">Envoyer</button></form>
    </aside>
  </div>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script>
/* Registre des jeux : chaque fichier de public/games/ appelle TV.register({...}). */
window.TV = { games: {}, order: [], register(g){ this.games[g.id]=g; this.order.push(g.id); if(g.css){ const st=document.createElement("style"); st.textContent=g.css; document.head.append(st); } } };
/* Jeux annoncés mais pas encore jouables. */
TV.soon = [
  { id:"coinche", name:"Coinche", tagline:"La belote contrée : enchères, coinche et surcoinche, en équipes de deux.", players:"4 joueurs", accent:"#ff5470", preview:()=>`<div class="suits"><span class="b">♠</span><span class="r">♥</span><span class="r">♦</span><span class="b">♣</span></div>` },
  { id:"bridge", name:"Bridge", tagline:"Enchères, contrat et mort : le grand classique des jeux de levées.", players:"4 joueurs", accent:"#4fb3ff", preview:()=>`<div class="suits"><span class="b">♣</span><span class="r">♦</span><span class="r">♥</span><span class="b">♠</span></div>` },
];
</script>
<script src="/games/sixieme.js"></script>
<script>
(() => {
const COLORS = ["#ffb22e","#4fc3f7","#ff6a5c","#7be08a","#c7a5ff","#ff8ad8","#f5e663","#5fe0d0","#ffffff","#ff9a4d"];
const QUICK = ["😂","😱","🔥","👏","😭","🤔","GG","Bien joué !"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

let code = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
let ws=null, S=null, view="connecting", errMsg="", retry=0, myId=null, gameId=null, pickGame=null;
let myName = store.get("sb-name") || "", myColor = store.get("sb-color") || COLORS[Math.floor(Math.random()*COLORS.length)];
const gameDef = () => TV.games[gameId] || null;

/* ---------------- chat ---------------- */
$("quick").innerHTML = QUICK.map(q=>`<button type="button" data-quick="${esc(q)}">${esc(q)}</button>`).join("");
function msgEl(m){
  const d=document.createElement("div");
  if (m.sys){ d.className="msg sys"; d.textContent=m.text; return d; }
  d.className="msg"+(m.id===myId?" mine":"");
  d.style.setProperty("--mc", /^#[0-9a-fA-F]{6}$/.test(m.color)?m.color:"#ffb22e");
  const b=document.createElement("b"); b.textContent=m.name;
  d.append(b, document.createTextNode(m.text));
  return d;
}
function appendMsg(m){
  const log=$("chatlog"), near=log.scrollHeight-log.scrollTop-log.clientHeight<60;
  log.append(msgEl(m));
  while (log.children.length>150) log.firstChild.remove();
  if (near || m.id===myId) log.scrollTop=log.scrollHeight;
}
$("chatform").onsubmit=e=>{ e.preventDefault(); const i=$("chatin"), t=i.value.trim(); if(!t) return; send({t:"chat", text:t}); i.value=""; };
document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>send({t:"chat", text:b.dataset.quick}));

/* ---------------- connexion ---------------- */
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    retry = 0;
    const token = code ? store.get("sb-token-"+code) : null;
    if (code && token) send({t:"hello", room:code, token, name:myName, color:myColor});
    else if (code) send({t:"hello", room:code});
    else { view = pickGame ? "create" : "home"; render(); }
  };
  ws.onmessage = e => { let m; try { m=JSON.parse(e.data); } catch { return; } onMsg(m); };
  ws.onclose = () => {
    if (view==="error") return;
    $("status").textContent = "Reconnexion…";
    setTimeout(connect, Math.min(8000, 500 * 2 ** retry++));
  };
}
function send(m){ if (ws && ws.readyState===1) ws.send(JSON.stringify(m)); else toast("Connexion perdue, nouvelle tentative…"); }
function onMsg(m){
  if (m.t==="chatlog"){ $("chatlog").innerHTML=""; (m.list||[]).forEach(appendMsg); $("chatlog").scrollTop=1e9; return; }
  if (m.t==="chat"){ appendMsg(m.msg); return; }
  if (m.t==="joined"){ myId=m.you; code=m.room; gameId=m.game; store.set("sb-token-"+code, m.token); history.replaceState(null,"","?room="+code); return; }
  if (m.t==="need_name"){ code=m.room; gameId=m.game; view="join"; render(); return; }
  if (m.t==="error"){ view="error"; errMsg=m.msg; render(); return; }
  if (m.t==="toast"){ toast(esc(m.msg)); return; }
  if (m.t==="state"){
    S=m.state; gameId=S.game; view="table";
    if (S.g && S.g.deadlineIn) S.g.deadlineAt = Date.now()+S.g.deadlineIn;
    if (S.g && gameDef()?.onState) gameDef().onState(S, ctx());
    render();
  }
}

/* ---------------- outils partagés par les jeux ---------------- */
const isHost = () => S && S.hostId===S.you;
const inviteLink = () => `${location.origin}/?room=${code}`;
function bandColor(pct){ return `hsl(${Math.round(130*(1-Math.min(1,pct)))} 80% 52%)`; }
function miniBar(pct, color){ return `<div class="mbar"><i style="width:${Math.min(100,Math.max(0,pct)*100).toFixed(1)}%;--bc:${color||bandColor(pct)}"></i></div>`; }
// Liste des scores : lowWins = le plus petit score gagne (barre vert→rouge vers la défaite), sinon barre de progression vers la victoire.
function scoreList(items, {threshold, lowWins=true, unit="points"}={}){
  if (!items.length) return "";
  const scores=items.map(x=>x.score), min=Math.min(...scores), max=Math.max(...scores);
  return `<ul class="players">${items.map(p=>{
    const pct = threshold ? p.score/threshold : 0, left=threshold?Math.max(0,threshold-p.score):0;
    const lead = lowWins ? (p.score===min && max>min) : (p.score===max && max>min);
    const risk = lowWins && (pct>=0.75 || (p.score===max && max>min && pct>=0.5));
    const bar = threshold ? `<span class="bar" aria-hidden="true"><i style="width:${Math.min(100,pct*100).toFixed(1)}%;--bc:${lowWins?bandColor(pct):(p.color||"var(--good)")}"></i></span>` : "";
    const remain = threshold ? (lowWins ? (left>0?`encore ${left} avant ${threshold}`:"seuil atteint") : (left>0?`${left} ${unit} pour gagner`:"objectif atteint")) : "";
    return `<li class="pl ${p.id===S.you?"me":""} ${p.online===false?"off":""} ${lowWins&&pct>=0.75?"danger":""}"><span class="dot" style="background:${esc(p.color)}"></span>
      <span class="nm">${esc(p.name)}${p.id===S.you?" (vous)":""}${lead?`<span class="tag lead">En tête</span>`:""}${risk?`<span class="tag risk">Danger</span>`:""}
      <span class="st">${p.online===false?"Déconnecté":(p.sub||"")}${remain?` · ${remain}`:""}</span></span>
      <span class="sc">${p.score}${p.extra?`<small>${esc(p.extra)}</small>`:""}</span>${bar}</li>`;
  }).join("")}</ul>`;
}
function hostTools(extra=""){
  if (!isHost()) return "";
  return `<section class="panel stack"><h2>Outils de l'hôte</h2>${extra}
    <button class="ghost" id="abortBtn">Arrêter et revenir au salon</button>
    <div class="invite"><input id="link" readonly value="${esc(inviteLink())}" aria-label="Lien de la table"></div>
    <p class="note">Un ami qui recharge la page ou perd la connexion retrouve sa place avec ce même lien, sur le même navigateur.</p></section>`;
}
function overlay(html, handlers={}){
  const o=$("overlay");
  if (!html){ o.innerHTML=""; return; }
  o.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">${html}</div></div>`;
  for (const [id,fn] of Object.entries(handlers)){ const el=$(id); if (el) el.onclick=fn; }
}
const ctx = () => ({ app:$("app"), send, toast, esc, host:isHost(), you:S?.you, rerender:render, scoreList, hostTools, overlay, miniBar, bandColor });

/* ---------------- affichage ---------------- */
function render(){
  const a=document.activeElement, keep = a && a.id && a.tagName==="INPUT" && a.id!=="chatin" ? {id:a.id, v:a.value, s:a.selectionStart} : null;
  renderInner();
  const showChat = view==="table"; $("chat").hidden=!showChat; $("shell").classList.toggle("nochat", !showChat);
  if (view!=="table" || S?.phase!=="playing") overlay(null);
  const gd=gameDef();
  $("brand").innerHTML = view==="table"||view==="join" ? `${esc(gd?.name||"Tapis Vert")}<small>Tapis Vert · table ${esc(code)}</small>` : `Tapis Vert<small>Jeux entre amis, sans compte</small>`;
  document.title = gd && (view==="table"||view==="join") ? `${gd.name} · Tapis Vert` : "Tapis Vert";
  if (keep){ const el=$(keep.id); if (el && !el.disabled){ el.value=keep.v; el.focus(); try{ el.setSelectionRange(keep.s,keep.s); }catch{} } }
  tickTimers();
}
function colorPicker(){ return `<div class="colors">${COLORS.map(c=>`<button type="button" style="background:${c}" aria-label="Couleur ${c}" aria-pressed="${c===myColor}" data-color="${c}"></button>`).join("")}</div>`; }
function wireColors(onPick){
  document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{ myColor=b.dataset.color; store.set("sb-color",myColor); document.querySelectorAll("[data-color]").forEach(x=>x.setAttribute("aria-pressed", x===b)); onPick && onPick(); });
}
function readName(){ const v=$("nm").value.trim().slice(0,20); if(!v){ $("nm").focus(); toast("Choisissez un pseudo."); return null; } myName=v; store.set("sb-name",v); return v; }

function tile(g, soon){
  const inner = `<div class="art">${g.preview?g.preview():""}</div><h3>${esc(g.name)}</h3><p>${esc(g.tagline)}</p>
    <div class="meta"><span>${esc(g.players)}</span>${soon?`<span class="pill">Bientôt</span>`:`<span class="pill">Jouer</span>`}</div>`;
  return soon ? `<div class="gtile soon" style="--ga:${g.accent}">${inner}</div>` : `<button type="button" class="gtile" style="--ga:${g.accent}" data-game="${esc(g.id)}">${inner}</button>`;
}

function renderInner(){
  const app=$("app"), st=$("status");
  if (view==="connecting"){ st.textContent="Connexion…"; app.innerHTML=`<div class="panel center"><p class="note">Connexion…</p></div>`; return; }
  if (view==="error"){ st.textContent="Table introuvable"; app.innerHTML=`<div class="panel center stack"><h2>Oups</h2><p class="note">${esc(errMsg)}</p><button id="homeBtn">Retour au menu</button></div>`; $("homeBtn").onclick=()=>{ location.href="/"; }; return; }
  if (view==="home"){
    st.textContent="Choisissez un jeu";
    app.innerHTML = `<div class="stack" style="gap:20px">
      <div class="hero"><h1>À quoi on joue ce soir ?</h1><p>Choisissez un jeu, créez la table, puis envoyez le lien à vos amis. Personne n'a besoin de compte.</p></div>
      <div class="games">${TV.order.map(id=>tile(TV.games[id],false)).join("")}${TV.soon.filter(g=>!TV.games[g.id]).map(g=>tile(g,true)).join("")}</div>
      <p class="note" style="text-align:center">Vous avez reçu un lien d'invitation ? Ouvrez-le directement : il mène à la bonne table.</p>
    </div>`;
    app.querySelectorAll("[data-game]").forEach(b=>b.onclick=()=>{ pickGame=b.dataset.game; view="create"; render(); });
    return;
  }
  if (view==="create" || view==="join"){
    const join = view==="join", g = TV.games[join?gameId:pickGame];
    st.textContent = join ? `Table ${code}` : (g?.name || "");
    app.innerHTML = `<div class="panel center stack">
      <h2>${join?`Rejoindre la table <span class="code">${esc(code)}</span>`:`Nouvelle table de ${esc(g?.name)}`}</h2>
      ${g?.preview?`<div class="art" style="display:grid;place-items:center;padding:8px">${g.preview()}</div>`:""}
      <p class="note">${join?`On joue à <b>${esc(g?.name||"?")}</b>. Choisissez un pseudo et une couleur, puis installez-vous.`:"Vous serez l'hôte : vous réglez la partie et vous la lancez. Ensuite, envoyez le lien à vos amis."}</p>
      <div class="field"><label for="nm">Pseudo</label><input id="nm" maxlength="20" value="${esc(myName)}" placeholder="Votre nom" autocomplete="nickname"></div>
      <div class="field"><label>Couleur</label>${colorPicker()}</div>
      <div class="inline">${join?"":`<button type="button" class="ghost" id="backBtn">Retour</button>`}<button id="goBtn" style="flex:1">${join?"Rejoindre":"Créer la table"}</button></div>
    </div>`;
    wireColors();
    if ($("backBtn")) $("backBtn").onclick=()=>{ pickGame=null; view="home"; render(); };
    $("goBtn").onclick=()=>{ const n=readName(); if(!n) return; send(join?{t:"hello",room:code,name:n,color:myColor}:{t:"create",game:pickGame,name:n,color:myColor}); };
    $("nm").onkeydown=e=>{ if(e.key==="Enter") $("goBtn").click(); };
    return;
  }
  if (!S) return;
  const gd = gameDef();
  if (!gd){ st.textContent="Mise à jour nécessaire"; app.innerHTML=`<div class="panel center"><p class="note">Ce jeu n'est pas encore disponible dans cette page. Rechargez-la.</p></div>`; return; }
  if (S.phase==="lobby") return renderLobby(gd);
  st.innerHTML = gd.status ? gd.status(S, ctx()) : "";
  gd.render(S, ctx());
  const ab=$("abortBtn"); if (ab) ab.onclick=()=>{ if(ab.dataset.sure) send({t:"lobby"}); else { ab.dataset.sure="1"; ab.textContent="Confirmer l'arrêt de la partie"; } };
}

function renderLobby(gd){
  const s=S.settings, list=S.lobby, host=isHost();
  $("status").innerHTML = `Salon · ${list.length} joueur${list.length>1?"s":""}`;
  const amIn = list.some(p=>p.id===S.you);
  const check = gd.lobbyCheck ? gd.lobbyCheck(s, list.length, list) : {ok:list.length>=2, text:""};
  $("app").innerHTML = `
  <div class="lobby">
    <section class="panel stack">
      <h2>Inviter vos amis</h2>
      <div class="invite"><input id="link" readonly value="${esc(inviteLink())}" aria-label="Lien d'invitation"><button id="copyBtn">Copier</button></div>
      <p class="note">Envoyez ce lien à vos amis. Pas besoin de compte : ils l'ouvrent, choisissent un pseudo et s'installent. Code de la table : <b class="code" style="font-size:16px">${esc(S.code)}</b></p>
      <h2 style="margin-top:6px">Joueurs installés</h2>
      <ul class="players">${list.map(p=>`<li class="pl ${p.id===S.you?"me":""} ${p.online?"":"off"}"><span class="dot" style="background:${esc(p.color)}"></span><span class="nm">${esc(p.name)}${p.id===S.you?" (vous)":""}${p.id===S.hostId?" · hôte":""}<span class="st">${p.online?"Prêt":"Déconnecté"}</span></span>${host&&p.id!==S.you?`<button class="ghost mini" data-kick="${esc(p.id)}">Retirer</button>`:"<span></span>"}</li>`).join("") || `<li class="note">Personne pour l'instant.</li>`}</ul>
      ${gd.lobbyExtra ? gd.lobbyExtra(S, ctx()) : ""}
      <h2 style="margin-top:6px">Votre profil</h2>
      <div class="field"><label for="nm">Pseudo</label><input id="nm" maxlength="20" value="${esc(myName)}"></div>
      ${colorPicker()}
      <div class="inline"><button class="ghost" id="saveBtn">${amIn?"Mettre à jour":"S'installer à la table"}</button>${amIn&&!host?`<button class="ghost" id="leaveBtn">Regarder seulement</button>`:""}</div>
    </section>
    <section class="panel stack">
      <h2>Règles de la partie ${host?"":"<span class='note'>(réglées par l'hôte)</span>"}</h2>
      ${gd.settingsHTML(s, host?"":"disabled", S)}
      ${host?`<div class="inline"><button id="startBtn" ${check.ok?"":"disabled"}>Lancer la partie</button><button class="ghost" id="resetBtn">Réglages par défaut</button></div>
      <p class="note">${esc(check.text)}</p>`
      :`<p class="note">L'hôte lancera la partie quand tout le monde sera installé.</p>`}
    </section>
  </div>`;
  $("copyBtn").onclick=()=>{ const l=$("link"); const p=navigator.clipboard?.writeText(l.value); if(p) p.then(()=>toast("Lien copié !"),()=>{ l.select(); toast("Faites Ctrl+C pour copier."); }); else { l.select(); toast("Faites Ctrl+C pour copier."); } };
  wireColors(()=>{ if(amIn) send({t:"profile",name:myName,color:myColor}); });
  $("saveBtn").onclick=()=>{ const n=readName(); if(n) send({t:"profile",name:n,color:myColor,seated:true}); };
  if ($("leaveBtn")) $("leaveBtn").onclick=()=>send({t:"profile",name:myName,color:myColor,seated:false});
  document.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>send({t:"kick",id:b.dataset.kick}));
  if (gd.wireLobby) gd.wireLobby(S, ctx());
  if (!host) return;
  // Réglages : tout champ marqué data-setting est envoyé au serveur quand il change.
  document.querySelectorAll("[data-setting]").forEach(el=>el.onchange=()=>{
    const k=el.dataset.setting, kind=el.dataset.kind;
    const v = el.type==="checkbox" ? el.checked : kind==="bool" ? el.value==="1" : kind==="text" ? el.value : Number(el.value);
    send({t:"settings", settings:{[k]:v}});
  });
  $("startBtn").onclick=()=>send({t:"start"});
  $("resetBtn").onclick=()=>send({t:"settings", settings:{}, reset:true});
}

let toastT=null;
function toast(html){ $("toast").innerHTML=`<div class="toast"><span>${html}</span></div>`; clearTimeout(toastT); toastT=setTimeout(()=>$("toast").innerHTML="",3200); }
function tickTimers(){ document.querySelectorAll("[data-deadline]").forEach(t=>{ t.textContent=`⏱ ${Math.max(0,Math.ceil((Number(t.dataset.deadline)-Date.now())/1000))}s`; }); }
setInterval(tickTimers,500);
$("logo").onclick=e=>{ if(view==="table"&&S&&S.phase==="playing"){ e.preventDefault(); toast("Une partie est en cours : utilisez le lien de la table pour revenir."); } };

connect();
})();
</script>
</body>
</html>
