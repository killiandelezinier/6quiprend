<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sixième Bœuf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a felt card table — scoreboard rail on the side, rows in the middle, your hand at the bottom. */
:root{
  color-scheme: dark;
  --felt:#123a33; --felt-deep:#0b2723; --felt-line:#1f5248;
  --paper:#f6f3e9; --ink:#1b2422; --muted:#9fbdb4; --text:#eef6f2;
  --sun:#ffb22e; --sun-ink:#3a2500; --danger:#ff6a5c;
  --h1:#e7eee9; --h2:#9ed4ff; --h3:#ffd862; --h5:#ff8c7a; --h7:#c7a5ff;
  --display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cw: clamp(42px, 6.6vw, 66px);
}
*{box-sizing:border-box}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 90% at 50% 0%, var(--felt) 0%, var(--felt-deep) 75%) fixed, var(--felt-deep);color:var(--text);font-family:var(--body);font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px}
button{font-family:var(--body);font-weight:800;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-size:15px;background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 #b9770c;transition:transform .08s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9770c}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--felt-line)}
button.mini{padding:4px 8px;font-size:12px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible,.card.pickable:focus-visible,.row.choosable:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select{font-family:var(--body);font-size:15px;background:var(--felt-deep);color:var(--text);border:2px solid var(--felt-line);border-radius:10px;padding:8px 10px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1}
.logo svg{width:40px;height:40px;color:var(--sun)}
.logo small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.status{font-weight:800;background:rgba(0,0,0,.25);border-radius:999px;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;color:var(--sun)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:16px;padding:14px;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 10px;letter-spacing:.3px}
.center{max-width:460px;margin:30px auto 0;width:100%}
.players{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.pl{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:10px;background:rgba(255,255,255,.03)}
.pl.me{background:rgba(255,178,46,.12)}
.pl .dot{width:14px;height:14px;border-radius:50%}
.pl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pl .st{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.pl .sc{font-variant-numeric:tabular-nums;font-weight:800;display:flex;align-items:center;gap:4px}
.pl .sc svg{width:16px;height:16px;color:var(--h5)}
.pl.off{opacity:.5}
.board{display:flex;flex-direction:column;gap:14px;min-width:0}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:14px;background:rgba(0,0,0,.18);border:2px dashed transparent;overflow-x:auto}
.row.choosable{border-color:var(--sun);cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
.row.choosable:hover{background:rgba(255,178,46,.15)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,178,46,.25)}}
.slot{flex:0 0 var(--cw);height:calc(var(--cw)*1.42);border-radius:9px;border:2px dashed rgba(255,255,255,.1)}
.slot.sixth{border-color:rgba(255,106,92,.55);display:grid;place-items:center;color:var(--danger);font-family:var(--display);font-size:calc(var(--cw)*.36)}
.rowinfo{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:4px;font-weight:800;color:var(--muted);padding-left:6px;font-variant-numeric:tabular-nums}
.rowinfo svg{width:16px;height:16px}
.card{flex:0 0 var(--cw);width:var(--cw);height:calc(var(--cw)*1.42);border-radius:9px;background:var(--paper);color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.35);user-select:none;overflow:hidden}
.card .band{position:absolute;inset:0 0 auto 0;height:28%;display:flex;align-items:center;justify-content:center;gap:1px;flex-wrap:wrap;padding:2px}
.card .band svg{width:calc(var(--cw)*.2);height:calc(var(--cw)*.2);color:var(--ink);opacity:.8}
.card .num{font-family:var(--display);font-size:calc(var(--cw)*.46);margin-top:18%;line-height:1}
.card .corner{position:absolute;bottom:4px;right:6px;font-size:calc(var(--cw)*.17);font-weight:800;opacity:.55}
.card[data-h="1"] .band{background:var(--h1)} .card[data-h="2"] .band{background:var(--h2)} .card[data-h="3"] .band{background:var(--h3)} .card[data-h="5"] .band{background:var(--h5)} .card[data-h="7"] .band{background:var(--h7)}
.card[data-h="5"]{box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 0 0 3px var(--h5)}
.card[data-h="7"]{box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 0 0 3px var(--h7)}
.card.new{animation:drop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-30px) scale(1.15) rotate(-6deg);opacity:0}}
.reveal{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;min-height:20px}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;max-width:calc(var(--cw) + 20px)}
.rv span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv.cur .card{transform:translateY(-8px);box-shadow:0 0 0 3px var(--sun),0 8px 16px rgba(0,0,0,.4)}
.rv.flipin .card{animation:flip .4s ease-out both}
@keyframes flip{from{transform:rotateY(90deg)}}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:12px 4px 4px}
.card.pickable{cursor:pointer;transition:transform .12s}
.card.pickable:hover{transform:translateY(-6px)}
.card.sel{transform:translateY(-14px)!important;box-shadow:0 0 0 3px var(--sun),0 10px 18px rgba(0,0,0,.45)}
.handbar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-weight:600;text-align:center;margin:0}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;box-shadow:none}
.colors button[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.invite{display:flex;gap:8px}
.invite input{flex:1;font-weight:700}
.code{font-family:var(--display);font-size:26px;letter-spacing:.15em;color:var(--sun)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend .card{--cw:38px}
.overlay{position:fixed;inset:0;background:rgba(5,18,16,.72);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--felt);border:2px solid var(--felt-line);border-radius:20px;padding:22px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-align:center}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--felt-line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30;display:flex;gap:8px;align-items:center;animation:toast .3s ease-out;max-width:calc(100% - 32px)}
.toast svg{width:22px;height:22px;color:var(--danger);flex:0 0 auto}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}
.big{font-family:var(--display);font-size:22px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bull" viewBox="0 0 24 24"><path fill="currentColor" d="M1.5 4.5c.6 3.2 2.6 5 5.2 5.4h10.6c2.6-.4 4.6-2.2 5.2-5.4.9 3.9-.9 7-4.3 8v3.2c0 3.3-2.5 6-6.2 6s-6.2-2.7-6.2-6v-3.2c-3.4-1-5.2-4.1-4.3-8zM9 13.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm6 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zM9.6 18.4c0 .8 1.1 1.4 2.4 1.4s2.4-.6 2.4-1.4-1.1-1.2-2.4-1.2-2.4.4-2.4 1.2z"/></symbol>
</svg>
<div class="wrap">
  <header>
    <div class="logo"><svg aria-hidden="true"><use href="#bull"/></svg><div>Sixième Bœuf<small>Ne posez pas la sixième carte</small></div></div>
    <div class="status" id="status">Connexion…</div>
  </header>
  <main id="app"><div class="panel center"><p class="note">Connexion à la table…</p></div></main>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script>
(() => {
const COLORS = ["#ffb22e","#4fc3f7","#ff6a5c","#7be08a","#c7a5ff","#ff8ad8","#f5e663","#5fe0d0","#ffffff","#ff9a4d"];
const heads = n => n===55 ? 7 : n%11===0 ? 5 : n%10===0 ? 3 : n%5===0 ? 2 : 1;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bull = '<svg aria-hidden="true"><use href="#bull"/></svg>';
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

let code = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
let ws=null, S=null, view="connecting", errMsg="", retry=0, deadlineAt=0;
let myName = store.get("sb-name") || "", myColor = store.get("sb-color") || COLORS[Math.floor(Math.random()*COLORS.length)];
let selCard=null, seenCards=new Set(), lastSeq=-1, pending=false, flipKey="";

/* ---------------- connection ---------------- */
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}`);
  ws.onopen = () => {
    retry = 0;
    const token = code ? store.get("sb-token-"+code) : null;
    if (code && token) send({t:"hello", room:code, token, name:myName, color:myColor});
    else if (code) { view="join"; render(); }
    else { view="home"; render(); }
  };
  ws.onmessage = e => { let m; try { m=JSON.parse(e.data); } catch { return; } onMsg(m); };
  ws.onclose = () => {
    if (view==="error") return;
    $("status").textContent = "Reconnexion…";
    setTimeout(connect, Math.min(8000, 500 * 2 ** retry++));
  };
}
function send(m){ if (ws && ws.readyState===1) ws.send(JSON.stringify(m)); else toast("Connexion perdue, nouvelle tentative…"); }
function onMsg(m){
  if (m.t==="joined"){ code=m.room; store.set("sb-token-"+code, m.token); history.replaceState(null,"","?room="+code); return; }
  if (m.t==="need_name"){ code=m.room; view="join"; render(); return; }
  if (m.t==="error"){ view="error"; errMsg=m.msg; render(); return; }
  if (m.t==="toast"){ toast(esc(m.msg)); return; }
  if (m.t==="state"){
    S=m.state; view="table"; pending=false;
    deadlineAt = S.deadlineIn ? Date.now()+S.deadlineIn : 0;
    onEvent(); render();
  }
}

/* ---------------- helpers ---------------- */
function cardHTML(n, extra="", attrs=""){
  const h = heads(n);
  return `<div class="card ${extra}" data-h="${h}" ${attrs} aria-label="Carte ${n}, ${h} tête${h>1?"s":""}"><div class="band">${bull.repeat(h)}</div><div class="num">${n}</div><div class="corner">${n}</div></div>`;
}
const playerById = id => S?.players?.find(p=>p.id===id);
const pname = id => playerById(id)?.name ?? "?";
const isHost = () => S && S.hostId===S.you;
const inviteLink = () => `${location.origin}${location.pathname}?room=${code}`;
function colorPicker(){ return `<div class="colors">${COLORS.map(c=>`<button type="button" style="background:${c}" aria-label="Couleur ${c}" aria-pressed="${c===myColor}" data-color="${c}"></button>`).join("")}</div>`; }
function wireColors(onPick){
  document.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{ myColor=b.dataset.color; store.set("sb-color",myColor); document.querySelectorAll("[data-color]").forEach(x=>x.setAttribute("aria-pressed", x===b)); onPick && onPick(); });
}
function readName(){ const v=$("nm").value.trim().slice(0,20); if(!v){ $("nm").focus(); toast("Choisissez un pseudo."); return null; } myName=v; store.set("sb-name",v); return v; }

/* ---------------- rendering ---------------- */
function render(){
  const a=document.activeElement, keep = a && a.id && a.tagName==="INPUT" ? {id:a.id, v:a.value, s:a.selectionStart} : null;
  renderInner();
  if (keep){ const el=$(keep.id); if (el && !el.disabled){ el.value=keep.v; el.focus(); try{ el.setSelectionRange(keep.s,keep.s); }catch{} } }
}
function renderInner(){
  const app=$("app"), st=$("status");
  if (view==="connecting"){ st.textContent="Connexion…"; app.innerHTML=`<div class="panel center"><p class="note">Connexion à la table…</p></div>`; return; }
  if (view==="error"){ st.textContent="Table introuvable"; app.innerHTML=`<div class="panel center stack"><h2>Oups</h2><p class="note">${esc(errMsg)}</p><button id="homeBtn">Créer une nouvelle table</button></div>`; $("homeBtn").onclick=()=>{ location.href=location.pathname; }; return; }
  if (view==="home" || view==="join"){
    const join = view==="join";
    st.textContent = join ? `Table ${code}` : "Bienvenue";
    app.innerHTML = `<div class="panel center stack">
      <h2>${join?`Rejoindre la table <span class="code">${esc(code)}</span>`:"Créer une table"}</h2>
      <p class="note">${join?"Choisissez un pseudo et une couleur, puis installez-vous.":"Vous serez l'hôte : vous réglez la partie et vous la lancez. Ensuite, envoyez le lien à vos amis."}</p>
      <div class="field"><label for="nm">Pseudo</label><input id="nm" maxlength="20" value="${esc(myName)}" placeholder="Votre nom" autocomplete="nickname"></div>
      <div class="field"><label>Couleur</label>${colorPicker()}</div>
      <button id="goBtn">${join?"Rejoindre":"Créer la table"}</button>
      <div class="field"><label>Têtes par carte</label><div class="legend">${[3,5,10,11,55].map(n=>cardHTML(n)).join("")}</div></div>
    </div>`;
    wireColors();
    $("goBtn").onclick=()=>{ const n=readName(); if(!n) return; send(join?{t:"hello",room:code,name:n,color:myColor}:{t:"create",name:n,color:myColor}); };
    $("nm").onkeydown=e=>{ if(e.key==="Enter") $("goBtn").click(); };
    return;
  }
  if (!S) return;
  if (S.phase==="lobby") return renderLobby();
  renderGame();
}

function renderLobby(){
  const s=S.settings, list=S.lobby, host=isHost();
  $("status").innerHTML = `Table ${esc(S.code)} · ${list.length} joueur${list.length>1?"s":""}`;
  const dis = host ? "" : "disabled";
  const amIn = list.some(p=>p.id===S.you);
  const need = list.length*s.hand + s.rows;
  const ok = list.length>=2 && list.length<=10 && need<=s.maxCard;
  $("app").innerHTML = `
  <div class="lobby">
    <section class="panel stack">
      <h2>Inviter vos amis</h2>
      <div class="invite"><input id="link" readonly value="${esc(inviteLink())}" aria-label="Lien d'invitation"><button id="copyBtn">Copier</button></div>
      <p class="note">Envoyez ce lien à vos amis. Pas besoin de compte : ils l'ouvrent, choisissent un pseudo et s'installent. Code de la table : <b class="code" style="font-size:16px">${esc(S.code)}</b></p>
      <h2 style="margin-top:6px">Joueurs installés</h2>
      <ul class="players">${list.map(p=>`<li class="pl ${p.id===S.you?"me":""} ${p.online?"":"off"}"><span class="dot" style="background:${esc(p.color)}"></span><span class="nm">${esc(p.name)}${p.id===S.you?" (vous)":""}${p.id===S.hostId?" · hôte":""}<span class="st">${p.online?"Prêt":"Déconnecté"}</span></span>${host&&p.id!==S.you?`<button class="ghost mini" data-kick="${esc(p.id)}">Retirer</button>`:"<span></span>"}</li>`).join("") || `<li class="note">Personne pour l'instant.</li>`}</ul>
      <h2 style="margin-top:6px">Votre profil</h2>
      <div class="field"><label for="nm">Pseudo</label><input id="nm" maxlength="20" value="${esc(myName)}"></div>
      ${colorPicker()}
      <div class="inline"><button class="ghost" id="saveBtn">${amIn?"Mettre à jour":"S'installer à la table"}</button>${amIn&&!host?`<button class="ghost" id="leaveBtn">Regarder seulement</button>`:""}</div>
    </section>
    <section class="panel stack">
      <h2>Règles de la partie ${host?"":"<span class='note'>(réglées par l'hôte)</span>"}</h2>
      <div class="grid2">
        <div class="field"><label for="s-threshold">Fin de partie à (têtes)</label><input id="s-threshold" type="number" min="10" max="500" value="${s.threshold}" ${dis}></div>
        <div class="field"><label for="s-hand">Cartes en main</label><input id="s-hand" type="number" min="3" max="15" value="${s.hand}" ${dis}></div>
        <div class="field"><label for="s-rows">Nombre de rangées</label><input id="s-rows" type="number" min="2" max="6" value="${s.rows}" ${dis}></div>
        <div class="field"><label for="s-rowMax">Cartes max par rangée</label><input id="s-rowMax" type="number" min="3" max="8" value="${s.rowMax}" ${dis}></div>
        <div class="field"><label for="s-maxCard">Plus haute carte</label><input id="s-maxCard" type="number" min="40" max="200" value="${s.maxCard}" ${dis}></div>
        <div class="field"><label for="s-turnTime">Temps par tour</label><select id="s-turnTime" ${dis}>${[[0,"Illimité"],[20,"20 s"],[30,"30 s"],[45,"45 s"],[60,"1 min"],[90,"1 min 30"]].map(([v,l])=>`<option value="${v}" ${s.turnTime==v?"selected":""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="s-speed">Vitesse de résolution</label><select id="s-speed" ${dis}>${[[0.6,"Lente"],[1,"Normale"],[1.8,"Rapide"]].map(([v,l])=>`<option value="${v}" ${s.speed==v?"selected":""}>${l}</option>`).join("")}</select></div>
        <div class="field"><label for="s-tactical">Variante tactique</label><select id="s-tactical" ${dis}><option value="0" ${!s.tactical?"selected":""}>Non</option><option value="1" ${s.tactical?"selected":""}>Oui (paquet réduit)</option></select></div>
      </div>
      <p class="note">La ${s.rowMax+1}<sup>e</sup> carte posée sur une rangée la fait ramasser. Variante tactique : on joue seulement avec les cartes 1 à (joueurs × ${s.hand} + ${s.rows}).</p>
      <div class="field"><label>Têtes par carte</label><div class="legend">${[3,5,10,11,55].map(n=>cardHTML(n)).join("")}</div></div>
      ${host?`<div class="inline"><button id="startBtn" ${ok?"":"disabled"}>Lancer la partie</button><button class="ghost" id="resetBtn">Réglages par défaut</button></div>
      <p class="note">${list.length<2?"Il faut au moins 2 joueurs installés.":need>s.maxCard?`Pas assez de cartes : il en faut ${need}, la plus haute est ${s.maxCard}.`:list.length>10?"10 joueurs maximum.":"Tout le monde est là ? C'est parti."}</p>`
      :`<p class="note">L'hôte lancera la partie quand tout le monde sera installé.</p>`}
    </section>
  </div>`;
  $("copyBtn").onclick=()=>{ const l=$("link"); navigator.clipboard?.writeText(l.value).then(()=>toast("Lien copié !"),()=>{ l.select(); toast("Faites Ctrl+C pour copier."); }) ?? (l.select()); };
  wireColors(()=>{ if(amIn) send({t:"profile",name:myName,color:myColor}); });
  $("saveBtn").onclick=()=>{ const n=readName(); if(n) send({t:"profile",name:n,color:myColor,seated:true}); };
  if ($("leaveBtn")) $("leaveBtn").onclick=()=>send({t:"profile",name:myName,color:myColor,seated:false});
  document.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>send({t:"kick",id:b.dataset.kick}));
  if (!host) return;
  ["threshold","hand","rows","rowMax","maxCard","turnTime","speed","tactical"].forEach(k=>{
    $("s-"+k).onchange=e=>send({t:"settings", settings:{[k]: k==="tactical" ? e.target.value==="1" : Number(e.target.value)}});
  });
  $("startBtn").onclick=()=>send({t:"start"});
  $("resetBtn").onclick=()=>send({t:"settings", settings:{}, reset:true});
}

function phaseLabel(){
  switch(S.phase){
    case "choose": return `Manche ${S.round} · Tour ${S.turn}/${S.settings.hand} · Choisissez une carte`;
    case "reveal": return `Manche ${S.round} · Tour ${S.turn} · Résolution`;
    case "pickRow": return `${esc(pname(S.waiting))} choisit une rangée à ramasser`;
    case "roundEnd": return `Fin de la manche ${S.round}`;
    case "over": return `Partie terminée`;
  }
  return "";
}

function renderGame(){
  const s=S.settings, mine=playerById(S.you), host=isHost();
  $("status").innerHTML = `${phaseLabel()} ${deadlineAt?`<span class="timer" id="timer"></span>`:""}`;
  const statusOf = p => {
    if (S.phase==="choose") return p.locked ? "Carte posée" : "Réfléchit…";
    if (S.phase==="pickRow" && S.waiting===p.id) return "Choisit une rangée";
    return `${p.pile} carte${p.pile>1?"s":""} ramassée${p.pile>1?"s":""}`;
  };
  const players=[...S.players].sort((a,b)=>(a.total+a.round)-(b.total+b.round));
  const fk=`${S.round}-${S.turn}`, flipNow = S.phase==="reveal" && fk!==flipKey; if(S.phase==="reveal"||S.phase==="pickRow") flipKey=fk;
  const choosingRow = S.phase==="pickRow" && S.waiting===S.you;
  const rowsHTML = S.rows.map((r,i)=>{
    const tot=r.reduce((a,c)=>a+heads(c),0);
    const cards=r.map(c=>cardHTML(c, seenCards.has(c)?"":"new")).join("");
    return `<div class="row ${choosingRow?"choosable":""}" ${choosingRow?`role="button" tabindex="0" data-row="${i}" aria-label="Ramasser la rangée ${i+1} (${tot} têtes)"`:""}>${cards}${'<div class="slot"></div>'.repeat(Math.max(0,s.rowMax-r.length))}<div class="slot sixth" title="Celui qui pose ici ramasse la rangée">${s.rowMax+1}</div><div class="rowinfo">${tot} ${bull}</div></div>`;
  }).join("");
  let handHTML;
  if (mine){
    const hand=S.hand, canPick=S.phase==="choose" && S.myPick==null && !pending;
    if (selCard!=null && !hand.includes(selCard)) selCard=null;
    handHTML = `<section class="panel"><div class="handbar">
      ${canPick?`<p class="hint">${selCard==null?"Cliquez une carte pour la choisir (double-clic pour la jouer directement)":`Carte ${selCard} sélectionnée`}</p><button id="playBtn" ${selCard==null?"disabled":""}>Jouer cette carte</button>`
      : S.phase==="choose"?`<p class="hint">Vous avez posé le <b>${S.myPick ?? selCard}</b>. On attend les autres…</p>`
      : choosingRow?`<p class="hint big" style="color:var(--sun)">Votre carte est trop petite ! Cliquez la rangée que vous ramassez.</p>`
      : `<p class="hint">Votre main · ${hand.length} carte${hand.length>1?"s":""}</p>`}
      </div><div class="hand">${hand.map(c=>cardHTML(c,(canPick?"pickable ":"")+(c===selCard?"sel":""), canPick?`tabindex="0" role="button" data-card="${c}"`:"")).join("")}</div></section>`;
  } else handHTML = `<section class="panel"><p class="hint">Vous regardez la partie en spectateur. Vous pourrez jouer à la prochaine partie.</p></section>`;
  const hostTools = host ? `<section class="panel stack"><h2>Outils de l'hôte</h2>
    ${(S.phase==="choose"||S.phase==="pickRow")?`<button class="ghost" id="forceBtn">Jouer au hasard pour les retardataires</button>`:""}
    <button class="ghost" id="abortBtn">Arrêter et revenir au salon</button>
    <div class="invite"><input id="link" readonly value="${esc(inviteLink())}" aria-label="Lien de la table"></div>
    <p class="note">Un ami qui recharge la page ou perd la connexion retrouve sa place avec ce même lien, sur le même navigateur.</p></section>` : "";
  $("app").innerHTML = `<div class="layout">
    <aside class="stack">
      <section class="panel"><h2>Joueurs</h2><ul class="players">${players.map(p=>`<li class="pl ${p.id===S.you?"me":""} ${p.online?"":"off"}"><span class="dot" style="background:${esc(p.color)}"></span><span class="nm">${esc(p.name)}${p.id===S.you?" (vous)":""}<span class="st">${p.online?statusOf(p):"Déconnecté"}</span></span><span class="sc" title="Total (dont manche en cours)">${p.total+p.round}${bull}</span></li>`).join("")}</ul>
      <p class="note" style="margin-top:10px">Fin à ${s.threshold} têtes · le moins de têtes gagne.${S.spectators?` · ${S.spectators} spectateur${S.spectators>1?"s":""}`:""}</p></section>
      ${hostTools}
    </aside>
    <div class="board">
      ${S.reveal.length&&(S.phase==="reveal"||S.phase==="pickRow")?`<section class="panel"><h2>Cartes jouées</h2><div class="reveal">${S.reveal.map((r,i)=>`<div class="rv ${i===0?"cur":""} ${flipNow?"flipin":""}">${cardHTML(r.c)}<span style="color:${esc(playerById(r.id)?.color)}">${esc(pname(r.id))}</span></div>`).join("")}</div></section>`:""}
      <section class="rows" aria-label="Rangées">${rowsHTML}</section>
      ${handHTML}
    </div></div>`;
  S.rows.flat().forEach(c=>seenCards.add(c));
  wireGame(); renderOverlay(); tickTimer();
}

function wireGame(){
  document.querySelectorAll("[data-card]").forEach(el=>{
    const pick=()=>{ selCard=Number(el.dataset.card); render(); };
    el.onclick=pick; el.ondblclick=()=>{ selCard=Number(el.dataset.card); playSel(); };
    el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } };
  });
  if ($("playBtn")) $("playBtn").onclick=playSel;
  document.querySelectorAll("[data-row]").forEach(el=>{
    const go=()=>send({t:"row", r:Number(el.dataset.row)});
    el.onclick=go; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
  if ($("forceBtn")) $("forceBtn").onclick=()=>send({t:"force"});
  if ($("abortBtn")) $("abortBtn").onclick=()=>{ const b=$("abortBtn"); if(b.dataset.sure) send({t:"lobby"}); else { b.dataset.sure="1"; b.textContent="Confirmer l'arrêt de la partie"; } };
}
function playSel(){ if(selCard==null||S.phase!=="choose") return; pending=true; send({t:"pick", c:selCard}); render(); }

function renderOverlay(){
  const o=$("overlay");
  if (!S || (S.phase!=="roundEnd" && S.phase!=="over")){ o.innerHTML=""; return; }
  const ranked=[...S.players].sort((a,b)=>a.total-b.total), over=S.phase==="over", host=isHost();
  o.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${over?`${esc(ranked[0].name)} gagne !`:`Fin de la manche ${S.round}`}</h2>
    <table><thead><tr><th>#</th><th>Joueur</th><th class="n">Manche</th><th class="n">Total</th></tr></thead><tbody>
    ${ranked.map((p,i)=>`<tr><td>${i+1}</td><td><span style="color:${esc(p.color)}">●</span> ${esc(p.name)}${p.id===S.you?" (vous)":""}</td><td class="n">+${p.lastRound}</td><td class="n"><b>${p.total}</b></td></tr>`).join("")}
    </tbody></table>
    <p class="note" style="text-align:center">${over?`Le joueur avec le moins de têtes l'emporte.`:`Partie jusqu'à ${S.settings.threshold} têtes.`}</p>
    ${host?`<div class="inline" style="justify-content:center">${over?`<button id="againBtn">Nouvelle partie</button>`:`<button id="nextBtn">Manche suivante</button><button class="ghost" id="stopBtn">Arrêter là</button>`}</div>`:`<p class="hint">L'hôte lance la suite…</p>`}
  </div></div>`;
  if ($("nextBtn")) $("nextBtn").onclick=()=>send({t:"next"});
  if ($("againBtn")) $("againBtn").onclick=()=>send({t:"lobby"});
  if ($("stopBtn")) $("stopBtn").onclick=()=>send({t:"stop"});
}

let toastT=null;
function toast(html){ $("toast").innerHTML=`<div class="toast">${bull}<span>${html}</span></div>`; clearTimeout(toastT); toastT=setTimeout(()=>$("toast").innerHTML="",3200); }
function onEvent(){
  const ev=S?.ev; const seq=ev?.seq ?? 0;
  if (lastSeq===-1){ lastSeq=seq; return; }
  if (!ev || seq===lastSeq) return; lastSeq=seq;
  if (ev.type==="take") toast(`${ev.id===S.you?"Vous ramassez":esc(pname(ev.id))+" ramasse"} ${ev.n} carte${ev.n>1?"s":""} : <b>${ev.h} tête${ev.h>1?"s":""}</b>`);
  if (ev.type==="low" && ev.id!==S.you) toast(`${esc(pname(ev.id))} a joué trop petit et doit choisir une rangée`);
}
function tickTimer(){ const t=$("timer"); if(!t||!deadlineAt) return; t.textContent=`⏱ ${Math.max(0,Math.ceil((deadlineAt-Date.now())/1000))}s`; }
setInterval(tickTimer,500);

connect();
})();
</script>
</body>
</html>
